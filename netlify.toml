# Static UI on Netlify. The API is deployed separately (Render, see render.yaml).
# Set VITE_API_URL in Netlify's environment variables to the API's public URL.

[build]
  command = "npm run build --workspace @ips/web"
  publish = "apps/web/dist"
  # Skip the build when nothing the UI depends on changed (exit 0 = skip).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/web packages/sdk package.json package-lock.json netlify.toml"

[build.environment]
  NODE_VERSION = "22"
